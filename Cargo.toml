[package]
name = "clipper"
version = "0.1.0"
edition = "2021"
description = "Lightweight desktop video editor for YouTube Shorts"
license = "MIT"

[dependencies]
eframe = "0.32"
egui = "0.32"
ffmpeg-sidecar = "2"
image = "0.25"
rfd = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
